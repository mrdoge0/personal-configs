[global]

# Monitor
monitor_rule = name:DP-1,width:1920,height:1080,refresh:75

# More option see https://github.com/DreamMaoMao/mango/wiki/
# Window effect
blur = 1
blur_layer = 1
blur_optimized = 0
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2
shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff
border_radius = 12
no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 0.75
dim_enable = 0
dim_focused_color = 0x00000000
dim_unfocused_color = 0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations = 1
layer_animations = 1
animation_type_open = "slide"
animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.8
fade_in_begin_opacity = 0.5
fade_out_begin_opacity = 0.8
animation_duration_move = 500
animation_duration_open = 400
animation_duration_tag = 350
animation_duration_close = 800
animation_duration_focus = 0
animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]
animation_curve_focus = [0.46, 1.0, 0.29, 1]
animation_curve_opacity_fade_out = [0.5, 0.5, 0.5, 0.5]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 1]

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Master-Stack Layout Setting
new_is_master = 1
default_master_factor = 0.55
default_master_count = 1
tag_num = 9
smart_gaps = 0

# Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

# Monocle Layout Setting
monocle_tab_mode = 1
monocle_no_border = 0
monocle_no_gap = 0

# Deck Layout Setting
deck_tab_mode = 1

# Overview Setting
hotarea_size = 10
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5

# Misc
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag = 0
enable_floating_snap = 0
snap_distance = 30
float_full_to_top = 0
cursor_size = 24
drag_tile_to_tile = 1
drag_tile_small = 1

# keyboard
repeat_rate = 25
repeat_delay = 600
numlock_on = 0
xkb_rules_layout = "tr"

# mouse
# need relogin to make it apply
mouse_natural_scrolling = 0
cursor_size = 36
cursor_theme = Bibata-Modern-Classic

# Appearance
gap_inner_horizontal = 5
gap_inner_vertical = 5
gap_outer_horizontal = 10
gap_outer_vertical = 10
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 4
root_color = 0x100e3dff
border_color = 0x314687ff
drop_color = 0x8FBA7C55
split_color = 0xEB441EFF
focus_color = 0x69b2f6ff
maximized_screen_color = 0x89aa61ff
urgent_color = 0xad401fff
scratchpad_color = 0x516c93ff
global_color = 0xb153a7ff
overlay_color = 0x14a57cff

# Wallpaper
exec_once = "swaybg -i /HDD/Dosyalar/Resimler/migu.jpg -m fill"

# Autostart
exec_once = "mangobar"
exec_once = "kdeconnectd"
exec_once = "kdeconnect-indicator"
exec_once = "blueman-applet"

# Keyboard binds
[bind.default]
"SUPER+SHIFT+c" = "spawn_shell,mmsg dispatch reload_config && systemctl --user restart mangobar"
"SUPER+D" = "spawn,rofi -show drun"
"SUPER+T" = "spawn,kitty"
"SUPER+C" = "spawn,chromium"
"SUPER+E" = "spawn,nautilus"
"SUPER+G" = "spawn,steam"
"SUPER+O" = "spawn,obsidian"
"SUPER+period" = "spawn,gnome-characters"
"SUPER+SHIFT+E" = "spawn,wlogout"
"SUPER+SHIFT+Q" = "killclient,"
"PRINT" = "spawn_shell,grim $(source ${HOME}/.config/user-dirs.dirs && echo "${XDG_PICTURES_DIR}")/'Ekran Görüntüleri'/$(date +%Y%m%d%H%M%S).png"
"SUPER+Tab" = "focusstack,next"
"ALT+Left" = "focusdir,left"
"ALT+Right" = "focusdir,right"
"ALT+Up" = "focusdir,up"
"ALT+Down" = "focusdir,down"
"SUPER+SHIFT+Up" = "move_client,up"
"SUPER+SHIFT+Down" = "move_client,down"
"SUPER+SHIFT+Left" = "move_client,left"
"SUPER+SHIFT+Right" = "move_client,right"
"SUPER+n" = "switch_layout"
"SUPER+Left" = "viewtoleft,0"
"CTRL+Left" = "viewtoleft_have_client,0"
"SUPER+Right" = "viewtoright,0"
"CTRL+Right" = "viewtoright_have_client,0"
"CTRL+SUPER+Left" = "tagtoleft,0"
"CTRL+SUPER+Right" = "tagtoright,0"
"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"
"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"
"SUPER+SHIFT+8" = "tag,8,0"
"SUPER+SHIFT+9" = "tag,9,0"

# Mouse binds
[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"btn_middle" = "togglemaximizescreen,0"
"SUPER+btn_right" = "moveresize,curresize"

# Axis binds
[axisbind.default]
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"

# Gesture binds
[gesturebind.default]
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"

# Workspace rules

[[rule.tag_rule]]
id = 1
layout_name = "tile"

[[rule.tag_rule]]
id = 2
layout_name = "tile"

[[rule.tag_rule]]
id = 3
layout_name = "tile"

[[rule.tag_rule]]
id = 4
layout_name = "tile"

[[rule.tag_rule]]
id = 5
layout_name = "tile"

[[rule.tag_rule]]
id = 6
layout_name = "tile"

[[rule.tag_rule]]
id = 7
layout_name = "tile"

[[rule.tag_rule]]
id = 8
layout_name = "tile"

[[rule.tag_rule]]
id = 9
layout_name = "tile"

# Window rules

# Kitty
[[rule.window_rule]]
focused_opacity = 0.75
app_id = "kitty"

# All GNOME apps excl. Picture Viewer
[[rule.window_rule]]
focused_opacity = 0.75
app_id = "org.gnome.*"

# Blueman
[[rule.window_rule]]
focused_opacity = 0.75
app_id = "blueman"

# Pavucontrol
[[rule.window_rule]]
focused_opacity = 0.75
app_id = "pavucontrol"

# Mixtapes
[[rule.window_rule]]
focused_opacity = 0.75
app_id = "com.pocoguy.Muse"

# All GNOME apps excl. Picture Viewer
[[rule.window_rule]]
focused_opacity = 1
app_id = "org.gnome.Loupe"

# Popup & Layer rules

# Rofi
[[rule.layer_rule]]
animation_type_open = "zoom"
animation_type_close = "zoom"
layer_name = "rofi"
